<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>옵션 추가</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h2 class="mb-4 text-center">옵션 추가</h2>

  <form th:action="@{/admin/products/{productId}/options(productId=${productId})}" method="post" class="border p-4 bg-white rounded shadow-sm">
    <div class="mb-3">
      <label for="option" class="form-label">옵션명</label>
      <input type="text" id="option" name="option" maxlength="50" pattern="^[가-힣a-zA-Z0-9 \(\)\[\]\+\-\&\/_]+$"
             required
             class="form-control" placeholder="예: 블랙 / 라지 사이즈">
      <div th:if="${errorMessage}" class="text-danger mb-2" th:text="${errorMessage}"></div>
    </div>

    <div class="mb-3">
      <label for="quantity" class="form-label">수량</label>
      <input type="number" id="quantity" name="quantity" min="1" max="99999999" required
             class="form-control" placeholder="예: 100">
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-success">등록</button>
      <a th:href="@{/admin/products/{productId}/options(productId=${productId})}" class="btn btn-secondary ms-2">취소</a>
    </div>
  </form>
</div>
</body>
</html>
