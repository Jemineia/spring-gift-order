<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>옵션 목록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h2 class="mb-4 text-center">🧩 옵션 목록</h2>
  <div class="mb-3 text-end">
    <a th:href="@{/admin/products/{productId}/options/new(productId=${product.id})}" class="btn btn-primary">➕ 옵션 추가</a>
  </div>

  <table class="table table-striped table-hover align-middle text-center">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>상품명</th>
      <th>옵션명</th>
      <th>재고</th>
      <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="option : ${options}">
      <td th:text="${option.id}"></td>
      <td th:text="${option.product.name}"></td>
      <td th:text="${option.name}"></td>
      <td th:text="${option.quantity}"></td>
      <td>
        <a th:href="@{|/admin/options/${option.id}/edit|}" class="btn btn-sm btn-outline-secondary">재고 수정</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
